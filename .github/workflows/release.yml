name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Analyze & test
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test

      - name: Build APK
        run: flutter build apk --release --build-name="${GITHUB_REF_NAME#v}" --build-number=${{ github.run_number }}

      - name: Rename artefact
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk "out/Lemon-${{ github.ref_name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Lemon-android
          path: out/Lemon-${{ github.ref_name }}.apk

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          files: out/Lemon-${{ github.ref_name }}.apk
          overwrite: true
          fail_on_unmatched_files: true
          name: Lemon ${{ github.ref_name }}
          body: |
            **Lemon — Citrus Manager** (Flutter rewrite)

            Download the build for your platform from the assets below:

            | Platform | File |
            | --- | --- |
            | Android | `Lemon-${{ github.ref_name }}.apk` |
            | Windows | `Lemon-${{ github.ref_name }}-windows.zip` |
            | Linux | `Lemon-${{ github.ref_name }}-linux.tar.gz` |

            Fully offline: no network permission, AES-256-GCM vault,
            4-digit PIN with a decoy vault, TOTP with the lemon slice timer.

  windows:
    name: Windows build
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Inspect Visual Studio
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            & $vswhere -products * -version 16.0 -prerelease -format json
            & $vswhere -products * -version 16.0 -requires Microsoft.VisualStudio.Workload.NativeDesktop Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -format json
          } else { Write-Host "vswhere missing" }
          flutter doctor -v

      - name: Build Windows
        run: |
          flutter pub get
          flutter build windows --release

      - name: Package
        shell: pwsh
        run: |
          $src = "build/windows/x64/runner/Release"
          $dst = "out/Lemon-${{ github.ref_name }}-windows"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item -Recurse -Force "$src/*" $dst
          Compress-Archive -Path $dst -DestinationPath "out/Lemon-${{ github.ref_name }}-windows.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: Lemon-windows
          path: out/Lemon-${{ github.ref_name }}-windows.zip

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          files: out/Lemon-${{ github.ref_name }}-windows.zip
          overwrite: true
          fail_on_unmatched_files: true

  linux:
    name: Linux build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Build Linux
        run: |
          flutter pub get
          flutter build linux --release

      - name: Package
        run: |
          mkdir -p out
          tar -czf "out/Lemon-${{ github.ref_name }}-linux.tar.gz" -C build/linux/x64/release/bundle .
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Lemon-linux
          path: out/Lemon-${{ github.ref_name }}-linux.tar.gz

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          files: out/Lemon-${{ github.ref_name }}-linux.tar.gz
          overwrite: true
          fail_on_unmatched_files: true
