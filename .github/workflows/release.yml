name: Build & Release

# One tag -> one release with exactly two files:
#   Lemon-<tag>.apk           Android, one file, installs on any phone
#   Lemon-<tag>-setup.exe     Windows installer (falls back to a portable zip)
# (Linux users build from source: flutter build linux --release)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Analyze & test
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test

      - name: Build APK
        run: |
          # Single APK for real phones (arm64 + 32-bit ARM).
          # x86_64 is emulator-only and would add ~24 MB.
          flutter build apk --release \
            --target-platform android-arm,android-arm64 \
            --build-name=1.0.0 \
            --build-number=${{ github.run_number }}

      - name: Name the APK after the tag
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk "out/Lemon-${{ github.ref_name }}.apk"
          ls -la out

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: out/Lemon-${{ github.ref_name }}.apk
          overwrite_files: true
          fail_on_unmatched_files: true
          name: Lemon ${{ github.ref_name }}
          body: |
            **Lemon — Citrus Manager**

            | Platform | File |
            | --- | --- |
            | Android | `Lemon-${{ github.ref_name }}.apk` — one file, install directly |
            | Windows | `Lemon-${{ github.ref_name }}-setup.exe` — run it, click through |

            Linux: build from source with Flutter (`flutter build linux --release`).

            Fully offline — no network permission, AES-256-GCM vault, 4-digit PIN
            with a decoy vault, TOTP with the lemon slice timer.

  windows:
    name: Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Build Windows
        run: |
          flutter pub get
          flutter build windows --release

      - name: Build installer (single .exe)
        id: installer
        continue-on-error: true
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC not found" }

          $tag = "${{ github.ref_name }}"
          # AppVersion stays numeric: "1.1.0", derived from the tag "v1.1"
          $ver = ($tag -replace '^v','') -replace '^(\d+\.\d+)$','$1.0'

          $iss  = @"
          [Setup]
          AppName=Lemon
          AppVersion=$ver
          AppPublisher=Lemon
          DefaultDirName={autopf}\Lemon
          DefaultGroupName=Lemon
          OutputDir=out
          OutputBaseFilename=Lemon-$tag-setup
          SetupIconFile=windows\runner\resources\app_icon.ico
          UninstallDisplayIcon={app}\lemon.exe
          Compression=lzma2/max
          SolidCompression=yes
          WizardStyle=modern
          DisableProgramGroupPage=yes
          ArchitecturesInstallIn64BitMode=x64compatible

          [Files]
          Source: "build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: recursesubdirs createallsubdirs ignoreversion

          [Icons]
          Name: "{autoprograms}\Lemon"; Filename: "{app}\lemon.exe"
          Name: "{autodesktop}\Lemon"; Filename: "{app}\lemon.exe"; Tasks: desktopicon

          [Tasks]
          Name: "desktopicon"; Description: "Create a desktop shortcut"; GroupDescription: "Shortcuts:"

          [Run]
          Filename: "{app}\lemon.exe"; Description: "Launch Lemon"; Flags: nowait postinstall skipifsilent
          "@
          Set-Content -Path installer.iss -Value $iss -Encoding UTF8
          & $iscc installer.iss | Write-Host
          if (-not (Test-Path "out/Lemon-$tag-setup.exe")) { throw "installer missing" }

      - name: Publish installer
        if: steps.installer.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          files: out/Lemon-${{ github.ref_name }}-setup.exe
          overwrite_files: true
          fail_on_unmatched_files: true

      - name: Fallback - publish portable zip
        if: steps.installer.outcome != 'success'
        shell: pwsh
        run: |
          $src = "build/windows/x64/runner/Release"
          $dst = "out/Lemon-${{ github.ref_name }}-windows"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item -Recurse -Force "$src/*" $dst
          Compress-Archive -Path $dst -DestinationPath "out/Lemon-${{ github.ref_name }}-windows.zip" -Force

      - name: Publish portable zip
        if: steps.installer.outcome != 'success'
        uses: softprops/action-gh-release@v2
        with:
          files: out/Lemon-${{ github.ref_name }}-windows.zip
          overwrite_files: true
          fail_on_unmatched_files: true
