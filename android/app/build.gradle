plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.lemon.app"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "com.lemon.app"
        minSdkVersion = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            // The CI workflow writes these properties from repository secrets.
            // Without them the debug keystore keeps local builds installable.
            def storeFilePath = project.findProperty("LEMON_KEYSTORE")
            if (storeFilePath != null) {
                storeFile file(storeFilePath)
                storePassword project.findProperty("LEMON_KEYSTORE_PASSWORD")
                keyAlias project.findProperty("LEMON_KEY_ALIAS")
                keyPassword project.findProperty("LEMON_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            signingConfig = project.findProperty("LEMON_KEYSTORE") != null
                    ? signingConfigs.release
                    : signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source = "../.."
}

dependencies {}
